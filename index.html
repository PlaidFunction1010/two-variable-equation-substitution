<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代入消去法第二型｜二元一次聯立方程式練習</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: radial-gradient(circle at 20% 20%, #1e293b 0%, #0f172a 60%);
      border-right: 1px solid rgba(148,163,184,0.2);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .brand {
      font-size: 1rem;
      font-weight: 600;
      color: #38bdf8;
    }
    .nav-section-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 10px;
    }
    .nav-card {
      background: linear-gradient(145deg, rgba(30,41,59,0.8) 0%, rgba(15,23,42,0.4) 100%);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-card:hover, .nav-card.active {
      border-color: #38bdf8;
      box-shadow: 0 10px 30px rgba(56,189,248,0.3);
    }
    .nav-card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .nav-card-desc {
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .main {
      flex: 1;
      padding: 24px clamp(16px,2vw,32px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .header-text h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
      display: flex;
      align-items: baseline;
      gap: .5rem;
    }
    .badge {
      background: rgba(56,189,248,0.15);
      border: 1px solid rgba(56,189,248,0.6);
      color: #38bdf8;
      font-size: 0.7rem;
      border-radius: 999px;
      padding: 2px 8px;
    }
    .subtext {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .card {
      background: radial-gradient(circle at 20% 20%, #1e253a 0%, #0f172a 60%);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    button {
      background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.4));
      border: 1px solid rgba(148,163,184,0.3);
      color: #f8fafc;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.8rem;
    }
    button:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56,189,248,0.3);
      color: #38bdf8;
    }
    .equations-box {
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      margin-bottom: 12px;
      white-space: pre-line;
    }
    .feedback { font-size: 0.9rem; font-weight: 600; min-height: 1.2em; }
    .correct { color: #4ade80; }
    .wrong { color: #f87171; }
    .solution-box {
      display: none;
      background: rgba(15,23,42,0.6);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">鴻鈞數學練功房</div>

    <div>
      <div class="nav-section-title">代入消去法</div>
      <div class="nav-card">
        <div class="nav-card-title">第一型</div>
        <div class="nav-card-desc">一條式子只有單變數</div>
      </div>
      <div class="nav-card active">
        <div class="nav-card-title">第二型</div>
        <div class="nav-card-desc">需整理成 y=ax+b 再代入</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="header-text">
      <h1>代入消去法 <span class="badge">第二型</span></h1>
      <div class="subtext">將方程式一整理成 y=ax+b 或 x=ay+b，再代入方程式二解出 (x,y)</div>
    </div>

    <section class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>題目區</h2>
        <div>
          <button id="newQ">出題</button>
          <button id="checkAns">檢查答案</button>
        </div>
      </div>

      <div class="equations-box" id="questionBox">請按「出題」</div>

      <div>
        <label>x = </label><input type="number" id="ansX" />
        <label style="margin-left:10px;">y = </label><input type="number" id="ansY" />
        <button style="margin-left:10px;" id="clearBtn">清除</button>
      </div>

      <div id="feedback" class="feedback"></div>

      <div style="margin-top:10px; cursor:pointer; color:#38bdf8;" id="toggleDetail">▶ 顯示/隱藏詳解</div>
      <div id="solutionBox" class="solution-box"></div>
    </section>
  </main>

  <script>
    let curX = 0, curY = 0, eq1 = "", eq2 = "", sol = "";

    function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

    function genProblem(){
      // 1. 隨機整數解
      curX = randInt(-5,5);
      curY = randInt(-5,5);
      if(curX===0 && curY===0){curX=2;curY=-1;}

      // 2. 隨機方程式1: ax + by = c
      let a1=0,b1=0;
      while(a1===0 && b1===0){a1=randInt(-5,5); b1=randInt(-5,5);}
      const c1 = a1*curX + b1*curY;

      // 3. 方程式2: a2x + b2y = c2
      let a2=0,b2=0;
      while(a2===0 && b2===0){a2=randInt(-5,5); b2=randInt(-5,5);}
      const c2 = a2*curX + b2*curY;

      function term(coeff,varName){
        if(coeff===0)return "";
        if(coeff===1)return varName;
        if(coeff===-1)return "-"+varName;
        return coeff+varName;
      }
      function joinTerm(a,b){
        if(a && b){
          if(b[0]==='-') return a+" "+b;
          else return a+" + "+b;
        }
        return a||b;
      }

      const left1 = joinTerm(term(a1,"x"),term(b1,"y"));
      const left2 = joinTerm(term(a2,"x"),term(b2,"y"));
      eq1 = `式(1)：${left1} = ${c1}`;
      eq2 = `式(2)：${left2} = ${c2}`;

      // 4. 產生詳解
      let solSteps="";
      if(b1!==0){
        const step1 = `由式(1)：${a1}x + ${b1}y = ${c1}`;
        const step2 = `整理為 y = (${c1} - ${a1}x) ÷ ${b1}`;
        const step3 = `代入式(2)：${a2}x + ${b2}·[(${c1}-${a1}x)/${b1}] = ${c2}`;
        const step4 = `展開後得 ${(a2*b1 - b2*a1)}x = ${c2*b1 - b2*c1}`;
        const step5 = `x = (${c2*b1 - b2*c1}) ÷ (${a2*b1 - b2*a1}) = ${curX}`;
        const step6 = `代回 y = (${c1} - ${a1}×${curX}) ÷ ${b1} = ${curY}`;
        solSteps = [step1,step2,step3,step4,step5,step6,`答案：(x,y)=(${curX},${curY})`].join("\n");
      }else if(a1!==0){
        const step1 = `由式(1)：${a1}x + ${b1}y = ${c1}`;
        const step2 = `整理為 x = (${c1} - ${b1}y) ÷ ${a1}`;
        const step3 = `代入式(2)：${a2}·[(${c1}-${b1}y)/${a1}] + ${b2}y = ${c2}`;
        const step4 = `展開後得 ${(a1*b2 - a2*b1)}y = ${a1*c2 - a2*c1}`;
        const step5 = `y = (${a1*c2 - a2*c1}) ÷ (${a1*b2 - a2*b1}) = ${curY}`;
        const step6 = `代回 x = (${c1} - ${b1}×${curY}) ÷ ${a1} = ${curX}`;
        solSteps = [step1,step2,step3,step4,step5,step6,`答案：(x,y)=(${curX},${curY})`].join("\n");
      }
      sol = solSteps;

      document.getElementById("questionBox").textContent = eq1 + "\n" + eq2;
      document.getElementById("solutionBox").textContent = sol;
      document.getElementById("solutionBox").style.display="none";
      document.getElementById("feedback").textContent="";
    }

    function checkAns(){
      const x = Number(document.getElementById("ansX").value);
      const y = Number(document.getElementById("ansY").value);
      const fb = document.getElementById("feedback");
      if(x===curX && y===curY){
        fb.textContent = `✅ 正確！(x,y)=(${curX},${curY})`;
        fb.className="feedback correct";
      }else{
        fb.textContent = `❌ 再試試看喔～`;
        fb.className="feedback wrong";
      }
    }

    document.getElementById("newQ").onclick = genProblem;
    document.getElementById("checkAns").onclick = checkAns;
    document.getElementById("clearBtn").onclick = ()=>{
      document.getElementById("ansX").value="";
      document.getElementById("ansY").value="";
      document.getElementById("feedback").textContent="";
    };
    document.getElementById("toggleDetail").onclick = ()=>{
      const box=document.getElementById("solutionBox");
      box.style.display=(box.style.display==="none")?"block":"none";
    };
    genProblem();
  </script>
</body>
</html>
